name: Release

# electron-updater checks GitHub Releases for updates, so a release needs the
# installer/AppImage/dmg *and* the generated latest*.yml files uploaded
# together for every platform (see `publish` in electron-builder.yml).
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
